<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · Outlook 注册工作台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='12 12 232 232'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231e40af'/%3E%3Cstop offset='48%25' stop-color='%232574eb'/%3E%3Cstop offset='100%25' stop-color='%2310b981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='12' y='12' width='232' height='232' rx='52' fill='url(%23g)'/%3E%3Ccircle cx='124' cy='131' r='54' fill='none' stroke='%23fff' stroke-width='26'/%3E%3Cpath d='M 190 48 Q 190 69 211 69 Q 190 69 190 90 Q 190 69 169 69 Q 190 69 190 48 Z' fill='%23a7f3d0'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#2574eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: { 50: '#fcfbf9', 100: '#f5f2eb', 200: '#ebe5d8', 300: '#d8cfc0' },
            ink: { 500: '#6e675b', 700: '#3f3a33', 800: '#2a261f', 900: '#181511' },
            brand: { 50: '#eff8ff', 100: '#dbeefe', 500: '#2574eb', 600: '#1b62d1', 700: '#164ea8' },
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --ink: #181511;
      --muted: #6e675b;
      --brand: #2574eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-color: #f7f5ef;
      background-image:
        radial-gradient(1000px 480px at 0% 0%, rgba(37, 116, 235, 0.07), transparent 60%),
        radial-gradient(900px 450px at 100% 5%, rgba(22, 156, 98, 0.06), transparent 55%),
        linear-gradient(180deg, #fcfbf9 0%, #f3efe6 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      width: 100%;
      max-width: 26rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(34, 30, 24, 0.09);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 12px 32px -6px rgba(34, 30, 24, 0.07), 0 2px 8px -2px rgba(34, 30, 24, 0.04);
      border-radius: 1rem;
      padding: 2rem 2rem 1.75rem;
    }
    .field {
      width: 100%;
      height: 2.5rem;
      border-radius: 0.65rem;
      border: 1.5px solid #dcd4c4;
      background: #fff;
      padding: 0 0.8rem;
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field:hover { border-color: #c2b7a3; }
    .field:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37, 116, 235, 0.13);
    }
    .field-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #4a443a;
    }
    .btn-primary {
      width: 100%;
      height: 2.5rem;
      border-radius: 0.65rem;
      border: none;
      background: linear-gradient(135deg, #2574eb 0%, #169c62 100%);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px -2px rgba(37, 116, 235, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: filter .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover { filter: brightness(0.95); box-shadow: 0 6px 18px -2px rgba(37, 116, 235, 0.32); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .alert-error {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(225, 29, 72, 0.25);
      background: #fff1f2;
      color: #be123c;
      padding: 0.55rem 0.8rem;
      border-radius: 0.65rem;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }
    .alert-warn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(217, 119, 6, 0.28);
      background: #fffbeb;
      color: #92400e;
      padding: 0.55rem 0.8rem;
      border-radius: 0.65rem;
      font-size: 0.78rem;
      margin-top: 1rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="flex items-center gap-3 mb-6">
      <svg class="h-12 w-12 rounded-[0.85rem] shrink-0 ring-2 ring-white/80" style="box-shadow: 0 6px 16px -4px rgba(37, 116, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);" viewBox="12 12 232 232" role="img" aria-label="Outlook Register">
        <defs>
          <linearGradient id="login-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1e40af"/>
            <stop offset="48%" stop-color="#2574eb"/>
            <stop offset="100%" stop-color="#10b981"/>
          </linearGradient>
          <radialGradient id="login-glow" cx="0.2" cy="0.15" r="0.7">
            <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.38"/>
            <stop offset="100%" stop-color="#2574eb" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#login-bg)"/>
        <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#login-glow)"/>
        <path d="M 46 194 A 136 136 0 0 1 204 54" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round"/>
        <circle cx="124" cy="131" r="54" fill="none" stroke="#ffffff" stroke-width="26"/>
        <path d="M 190 48 Q 190 69 211 69 Q 190 69 190 90 Q 190 69 169 69 Q 190 69 190 48 Z" fill="#a7f3d0"/>
      </svg>
      <div>
        <h1 class="m-0 text-[1.15rem] font-bold tracking-tight" style="font-family:var(--font-sans)">Outlook 注册控制台</h1>
        <p class="m-0 text-xs mt-0.5" style="color:var(--muted)">请登录以继续访问工作台</p>
      </div>
    </div>

    <div id="alert" class="alert-error hidden" role="alert">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
      <span id="alert-text"></span>
    </div>

    <form id="form" autocomplete="on">
      <div class="mb-4">
        <label class="field-label" for="username">用户名</label>
        <input class="field" type="text" id="username" required autofocus
               autocomplete="username" placeholder="请输入用户名" />
      </div>
      <div class="mb-5">
        <label class="field-label" for="password">密码</label>
        <input class="field" type="password" id="password"
               required autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <button class="btn-primary" type="submit" id="submitBtn">登 录</button>
    </form>

    <div id="default-warn" class="alert-warn hidden">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span>当前为默认账号 <b class="font-mono">admin / admin</b>，登录后请前往导航栏右上角修改密码</span>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    let next = params.get('next') || '/';
    if (!next.startsWith('/') || next.startsWith('//')) next = '/';

    // 默认账号检测 (公开接口, 不含敏感信息)
    fetch('/api/auth/meta').then(r => r.json()).then(d => {
      if (d && d.is_default_credentials) {
        document.getElementById('default-warn').classList.remove('hidden');
      }
    }).catch(() => {});

    const alertBox = document.getElementById('alert');
    const alertText = document.getElementById('alert-text');
    function showError(text) {
      alertText.textContent = text;
      alertBox.classList.remove('hidden');
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '登录中…';
      alertBox.classList.add('hidden');
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            next: next,
          }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          location.href = d.next || next;
          return;
        }
        showError(d.message || ('HTTP ' + r.status));
      } catch (err) {
        showError('网络错误，请重试');
      }
      btn.disabled = false;
      btn.textContent = '登 录';
    });
  </script>
</body>
</html>
